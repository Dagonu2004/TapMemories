<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum - TapMemories</title>
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: '#F05B21',
              bone: '#F8F7F5'
            }
          }
        }
      }
    </script>
</head>
<body class="bg-bone min-h-screen flex flex-col relative">
    <header class="glass-effect py-4 px-6 sticky top-0 z-20 flex justify-center items-center">
        <div id="admin-back-btn" class="hidden absolute left-6">
            <button onclick="window.location.href='index.html'" class="text-gray-500 hover:text-brand transition-colors font-medium flex items-center gap-1">
                <span class="text-xl leading-none mb-1">&larr;</span> Volver
            </button>
        </div>
        <h1 id="album-title" class="text-xl font-bold text-gray-800 truncate px-2">Cargando...</h1>
    </header>

    <main class="flex-grow p-4 max-w-4xl mx-auto w-full mb-24 mt-2">
        <div id="photos-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4">
            <!-- Fotos -->
        </div>
    </main>

    <footer id="admin-upload-btn" class="hidden glass-effect p-4 fixed bottom-0 w-full flex justify-center pb-8 z-20">
        <label class="btn-brand font-bold py-3 px-8 rounded-full cursor-pointer flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
            </svg>
            Subir Foto
            <input type="file" id="photo-input" accept="image/*" multiple class="hidden">
        </label>
    </footer>

    <!-- Modal para ampliar fotos (Actualizado con Descarga) -->
    <div id="photo-modal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-sm flex justify-center items-center transition-opacity">
        
        <!-- Botón Descargar (Esquina Superior Izquierda) -->
        <button id="download-btn" data-action="download-photo" class="absolute top-6 left-6 text-white hover:text-brand p-2 z-50 transition-colors flex gap-2 items-center font-semibold cursor-pointer">
            <!-- pointer-events-none evita que el clic detecte el SVG en lugar del botón -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-7 h-7 pointer-events-none">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
            </svg>
            <span class="pointer-events-none hidden sm:inline">Guardar</span>
        </button>

        <!-- Botón Cerrar (Esquina Superior Derecha) -->
        <button id="close-modal-btn" class="absolute top-6 right-6 text-white hover:text-brand text-4xl font-bold p-2 z-50">&times;</button>
        
        <img id="modal-image" src="" alt="Foto ampliada" class="max-w-[95%] max-h-[90vh] object-contain rounded-lg shadow-2xl cursor-zoom-out" data-action="close-modal">
    </div>

    <script type="module" src="js/album.js"></script>
</body>
</html>
